<!DOCTYPE html>
<html lang="pt-BR" class="nr-menu-novo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="boss.css">
<style>
  

  /* ── RESET / SENSAÇÃO DE JOGO ── */
  html, body {
    margin: 0; padding: 0;
    background: #000 url('1789060700251.png') center center / cover no-repeat fixed;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    height: 100%;
    display: block !important;
    overflow: visible !important;
  }
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }

  /* Pausa TODAS as animações CSS quando um modal opaco cobre a tela
     (ex: tarefasOverlay). Evita gastar GPU/bateria animando algo que
     nem está visível. Os RAF dos canvas já pausam via _animacoesPausadas;
     isso cobre o resto (glow, shine, scan, ticker, pulse etc). */
  body.animacoes-pausadas *,
  body.animacoes-pausadas *::before,
  body.animacoes-pausadas *::after {
    animation-play-state: paused !important;
  }

  #bgCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  #startScreen {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    transition: transform 0.06s linear;
  }
  #startScreen.tremendo { animation: telaTremer 0.42s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes telaTremer {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
    40%, 60% { transform: translate3d(4px, 0, 0); }
  }

  .streak-badge {
    position:absolute;
    top:75px;
    left:0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 1px;
    color: #ffd700;
    background:#404040;
    padding:4px;
    border-radius: 0px 6px 6px 0px;
  }
  .streak-badge.visivel { opacity: 0.85; }

  .badge-sub {
    font-size: 6.5px;
    opacity: 0.6;
    margin-top:2px;
    letter-spacing: 0.5px;
    font-family: 'Share Tech Mono', monospace;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-ticker {
    position:absolute;
    bottom:5px;
    text-align:center;
    font-family: 'Share Tech Mono', monospace;
    font-size:0.1px;
    color:#fff;
    opacity: 0.55;
    text-align: center;
    height: 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .status-ticker::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background:Orange ;
    animation: tickerPing 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes tickerPing {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50%      { opacity: 1; transform: scale(1.15); }
  }

  .nr-topo-titulo {
    position: absolute;
    top: 73px;
    left: 0; right: 0;
    width: 100%;
  }

  #planetaCanvas {
    display: none;
  }

  .titulo-jogo {
    position: relative !important;
    left: 0 !important;
    right: auto !important;
    float: none !important;
    z-index: 1;
    width: 100% !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center !important;
    margin: 0 auto !important;
    padding: 0 6px;
    pointer-events: none;
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 2px;
    font-size: clamp(20px, 6vw, 36px);
    animation: tituloFlicker 6.5s infinite, bootIn 0.9s ease-out both;
  }
  .titulo-jogo .linha1 {
    display: block;
    color: #fff;
  }
  .titulo-jogo .linha2 {
    display: block;
    color: var(--cor-mapa, #00ffff);
    transition: color 0.15s;
  }
  @keyframes tituloFlicker {
    0%, 92%, 94.5%, 97%, 100% { opacity: 1; }
    93% { opacity: 0.5; }
    96% { opacity: .82; }
  }
  @keyframes bootIn {
    0% { opacity: 0; transform: scale(0.92); filter: blur(4px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes bootInPlain {
    0% { opacity: 0; transform: scale(0.94); filter: blur(3px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .titulo-jogo.piscando .linha2 { animation: glitchTroca 0.5s steps(2, end); }
  @keyframes glitchTroca {
    0%   { transform: translateX(0); filter: hue-rotate(0deg); }
    25%  { transform: translateX(-2px); filter: hue-rotate(90deg); }
    50%  { transform: translateX(2px); filter: hue-rotate(-90deg); }
    75%  { transform: translateX(-1px); filter: hue-rotate(45deg); }
    100% { transform: translateX(0); filter: hue-rotate(0deg); }
  }

  #scanOverlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 2px,
      transparent 4px
    );
  }
  #scanOverlay::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 140px;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--cor-mapa, #00ffff) 14%, transparent), transparent);
    transform: translateY(-140px);
    animation: scanSweep 7s linear infinite;
    opacity: 0.55;
    will-change: transform;
  }
  @keyframes scanSweep {
    0%   { transform: translateY(-140px); }
    100% { transform: translateY(100vh); }
  }

  #ambientGlow {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    animation: ambientBreathe 4.5s ease-in-out infinite;
  }
  @keyframes ambientBreathe {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  #warpOverlay {
    position: fixed;
    inset: 0;
    z-index: 6000;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  #warpOverlay.ativo { opacity: 1; }
  #warpOverlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--warp-cor, #00ffff);
    opacity: 0;
  }
  #warpOverlay.ativo::before { animation: warpFlash 0.45s ease forwards; }
  @keyframes warpFlash {
    0%   { opacity: 0; }
    55%  { opacity: 0.9; }
    100% { opacity: 0; }
  }
  .warp-anel {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 4px solid var(--warp-cor, #00ffff);
  }
  #warpOverlay.ativo .warp-anel {
    animation: warpExpandir 0.48s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes warpExpandir {
    to { width: 2400px; height: 2400px; border-width: 0; opacity: 0; }
  }

  .spark-toque {
    position: fixed;
    width: 4px; height: 4px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 50;
    animation: sparkFly 0.55s ease-out forwards;
  }
  @keyframes sparkFly {
    to { transform: translateY(-20px) scale(0); opacity: 0; }
  }

  #flashNegado {
    position: fixed;
    inset: 0;
    z-index: 4500;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 65%, rgba(255,30,60,0.32), transparent 65%);
    opacity: 0;
  }
  #flashNegado.ativo { animation: flashNegadoAnim 0.5s ease-out; }
  @keyframes flashNegadoAnim {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    100% { opacity: 0; }
  }

  #negadoToast {
    position: fixed;
    left: 50%;
    bottom: 14%;
    transform: translate(-50%, 10px);
    font-size: 2px;
    letter-spacing: 2px;
    z-index: 4600;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    color: #ff5577;
    background: rgba(10,0,4,0.88);
    border: 1.5px solid #ff3355aa;
    box-shadow: 0 0 24px rgba(255,40,80,0.5);
    padding: 10px 18px;
    border-radius: 10px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #negadoToast.ativo { opacity: 1; transform: translate(-50%, 0); }

  .shockwave {
    position: fixed;
    top: 50%; left: 50%;
    width: 900px; height: 900px;
    margin: -450px 0 0 -450px;
    border-radius: 50%;
    border: 2px solid var(--sw-cor, #00ffff);
    z-index: 4;
    pointer-events: none;
    opacity: 0.9;
    transform: scale(0.0111);
    will-change: transform, opacity;
    animation: shockwaveAnim 0.75s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes shockwaveAnim {
    0%   { transform: scale(0.0111); opacity: 0.85; }
    100% { transform: scale(1); opacity: 0; }
  }

  .hud-corner {
    position: fixed;
    width: 22px; height: 22px;
    z-index: 3;
    pointer-events: none;
    opacity: 0.5;
    border-color: var(--cor-mapa, #00ffff);
    transition: border-color 0.15s, opacity 0.15s;
  }
  .hud-corner.tl { top: 14px; left: 14px; border-top: 2px solid; border-left: 2px solid; }
  .hud-corner.tr { top: 14px; right: 14px; border-top: 2px solid; border-right: 2px solid; }
  .hud-corner.bl { bottom: 14px; left: 14px; border-bottom: 2px solid; border-left: 2px solid; }
  .hud-corner.br { bottom: 14px; right: 14px; border-bottom: 2px solid; border-right: 2px solid; }
  .hud-corner.alerta { border-color: #ff3355; opacity: 0.9; animation: alertaCorner 0.9s ease-in-out infinite; }
  @keyframes alertaCorner {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  .mapa-stack {
    position: absolute;
    top:180px;
    left:75px;
    width: min(170px, 90%);
    perspective: 1400px;
    perspective-origin: 50% 30%;
    animation: bootInPlain 0.9s 0.15s ease-out both;
  }

  .mapa-cards-area {
    position: relative;
    height: 200px;
    touch-action: pan-y;
  }
  
/* Moldura externa */
.mapa-cards-area::before {
    content: "";
    position: absolute;

    top: -17px;
    left: 6px;
    right: 6px;
    bottom: -17px;

    background: linear-gradient(
        135deg,
        #00f0ff 0%,
        #00d2ff 40%,
        #b026ff 80%,
        #e026ff 100%
    );

    clip-path: polygon(
        16px 0,
        100% 0,
        100% calc(100% - 16px),
        calc(100% - 16px) 100%,
        0 100%,
        0 16px
    );

    pointer-events: none;
    z-index: 0;
}


/* Interior da moldura */
.mapa-cards-area::after {
    content: "";
    position: absolute;

    top: -16px;
    left: 7px;
    right: 7px;
    bottom: -16px;

    background: #07151d;

    clip-path: polygon(
        15px 0,
        100% 0,
        100% calc(100% - 15px),
        calc(100% - 15px) 100%,
        0 100%,
        0 15px
    );

    pointer-events: none;
    z-index: 0;
}
  
  .btn-seta.btn-seta--lateral {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
  }
  .btn-seta--lateral.btn-seta:active { transform: translateY(-50%) scale(0.85); }
  .btn-seta--esq {
    left: -70px; }
  .btn-seta--dir { right: -70px; }

  .mapa-card {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    width: 100%;

    padding: 13px 16px;
    box-sizing: border-box;
    overflow: hidden;

    border: none;

    background: linear-gradient(
        135deg,
        #00f0ff 0%,
        #00d2ff 40%,
        #b026ff 80%,
        #e026ff 100%
    );

    color: #fff;

    clip-path: polygon(
        16px 0,
        100% 0,
        100% calc(100% - 16px),
        calc(100% - 16px) 100%,
        0 100%,
        0 16px
    );

    transform-style: preserve-3d;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    will-change: transform, opacity;

    transition:
        transform 0.5s cubic-bezier(.61,.06,.36,1),
        opacity 0.45s ease;
        z-index:1;
}

.mapa-card-1 {
    background-image: url("cidade-cyberpunk.jpg") !important;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

.mapa-card-2 {
    background-image: url("cidade-glacial.jpg") !important;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

.mapa-card-3 {
    background-image: url("cidade-infernal.jpg") !important;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

.mapa-card-4 {
    background-image: url("cidade-sombrio.jpg") !important;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

.mapa-card-5 {
    background-image: url("cidade-robotico.jpg") !important;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

.mapa-card-6 {
    background-image: url("cidade-void.jpg") !important;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

/* Interior escuro */
.mapa-card::before {
    content: "";
    position: absolute;
    inset: 1px;

    background: rgba(8,10,18,0.10);

    clip-path: polygon(
        15px 0,
        100% 0,
        100% calc(100% - 15px),
        calc(100% - 15px) 100%,
        0 100%,
        0 15px
    );

    z-index: 0;
}


/* Conteúdo do card */
.mapa-card > * {
    position: relative;
    z-index: 1;
}
  .mapa-card .mapa-numero { color: var(--card-cor, var(--cor-mapa, #00ffff)); }
  .mapa-card .mapa-tema-display { color: var(--card-cor, var(--cor-mapa, #00ffff)); }


  .mapa-card.mapa-card--arrastando {
    transition: none !important;
  }

  .mapa-card .card-glow {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }
  .mapa-card.mapa-card--frente .card-glow {
    animation: cardGlowPulse 3s ease-in-out infinite;
  }
  @keyframes cardGlowPulse {
    0%, 100% { opacity: 0; }
    50%      { opacity: 1; }
  }
  .mapa-card.mapa-card--frente::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 45%;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--card-cor, var(--cor-mapa, #00ffff)) 16%, transparent), transparent);
    transform: translateY(-100%);
    animation: cardScan 4.2s linear infinite;
    will-change: transform;
    pointer-events: none;
  }
  @keyframes cardScan {
    0%   { transform: translateY(-100%); }
    100% { transform: translateY(222%); }
  }

  .mapa-card.travada .mapa-nome-display,
  .mapa-card.travada .mapa-tema-display { opacity: 0.55; }
  .mapa-card.travada::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, transparent 1px, transparent 3px);
    animation: estaticaTravada 0.35s steps(2) infinite;
    opacity: 0.5;
  }
  @keyframes estaticaTravada {
    0%   { transform: translateY(0); }
    100% { transform: translateY(3px); }
  }

  .mapa-destaque-badge {
    position: absolute;
    top: -1px; right: 14px;
    font-family: 'Orbitron', monospace;
    font-size: 2px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #050505;
    background: linear-gradient(90deg, #ffd700, #fff3a0);
    padding: 3px 5px 2px;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 3px 12px rgba(255,215,0,0.55);
    animation: destaqueFlutuar 2.4s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes destaqueFlutuar {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(2px); }
  }

  .mapa-novo-badge {
    position: absolute;
    top: -1px; left: 14px;
    font-family: 'Orbitron', monospace;
    font-size: 2px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #04140a;
    background: linear-gradient(90deg, #00ff88, #b6ffde);
    padding: 4px 9px 3px;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 3px 12px rgba(0,255,136,0.55);
    animation: destaqueFlutuar 2s ease-in-out infinite;
    z-index: 5;
  }

  .confete {
    position: fixed;
    top: -12px;
    width: 6px; height: 11px;
    border-radius: 1px;
    z-index: 4700;
    pointer-events: none;
    opacity: 0.95;
    animation: confeteCair linear forwards;
  }
  @keyframes confeteCair {
    to { transform: translateY(112vh) rotate(560deg); opacity: 0; }
  }

  .mapa-progresso {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .mapa-progresso .barra {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 3px;
    overflow: hidden;
  }
  .mapa-progresso .barra span {
    display: block;
    height: 100%;
    background: var(--card-cor, var(--cor-mapa, #00ffff));
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(.4,1.4,.6,1);
  }

  .mapa-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
  }
  .mapa-numero {
    font-family: 'Share Tech Mono', monospace;
    font-size: 2px;
    letter-spacing: 3px;
    color: var(--cor-mapa, #00ffff);
    opacity: 0.65;
    transition: color 0.15s;
  }
  .mapa-status {
    font-family: 'Orbitron', monospace;
    font-size: 1px;
    font-weight: 700;
    padding: 3px 3px;
    border-radius: 25%;
    transition: all 0.3s;
  }
  .mapa-status.desbloqueado {
    background: rgba(0,255,100,0.15);
    border: 1px solid #00ff6688;
    color: #00ff88;
  }
  .mapa-status.bloqueado {
    background: rgba(255,50,50,0.12);
    border: 1px solid #ff444488;
    color: #ff6666;
    animation: statusBloqueadoPulso 1.8s ease-in-out infinite;
  }
  @keyframes statusBloqueadoPulso {
    0%, 100% { box-shadow: 0 0 0 rgba(255,60,80,0); }
    50%      { box-shadow: 0 0 10px rgba(255,60,80,0.45); }
  }

  .mapa-nome-display {
    font-family: 'Orbitron', monospace;
    font-size: clamp(7px, 7.6vw, 14px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    margin-bottom: 2px;
    
  }
  .mapa-tema-display {
    font-family: 'Share Tech Mono', monospace;
    font-size: 7px;
    letter-spacing: 3px;
    color: var(--cor-mapa, #00ffff);
    opacity: 0.75;
    margin-bottom: 2px;
    transition: color 0.15s;
  }

  .seletor-mapa {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 4px;
    position: relative;
    z-index: 100;
  }
  .btn-seta {
    width: 42px; height: 42px;
    border-radius: 10px;
    background:#0B0E14;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
  }
  .btn-seta::before {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 15px;
    opacity: 0.5;
    pointer-events: none;
  }
  .btn-seta img {
    width: 16px;
  }
  #anterior img { transform: scaleX(-1); }
  .btn-seta:active {
    transform: scale(0.85);
  }

.btn-seta.btn-seta--lateral {
  width: 30px !important;
  height: 30px !important;
  min-width: 30px !important;
  min-height: 30px !important;

  background: #161B26 !important;

  border: 2px solid !important;
  border-image: linear-gradient(90deg, #00ffff, #ff00ff) 1 !important;
  box-shadow: 0 0 10px color-mix(in srgb, var(--cor-mapa, #00ffff) 35%, transparent) !important;
}
  .btn-seta.btn-seta--lateral img {
    width: 35px !important;
    height: auto !important;
  }

  .mapa-dots {
    display: flex;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }
  .mapa-dot {
    position: relative;
    bottom:-24px;
    width: 10px; height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.18);

  }

  }
  .hex-loader .hex:nth-child(3) {

  }
  /* Gira em estágios: acelera, segura um instante, acelera de novo —
     nunca para de vez, só pausa entre os "tiques". */
  @keyframes hexStepCW {
    0%, 15%   { transform: rotate(0deg); }
    25%, 45%  { transform: rotate(90deg); }
    55%, 75%  { transform: rotate(180deg); }
    85%, 100% { transform: rotate(360deg); }
  }
  @keyframes hexStepCCW {
    0%, 15%   { transform: rotate(0deg); }
    25%, 45%  { transform: rotate(-90deg); }

<script>
const MAPAS = [
  { nome: 'CYBERPUNK', tema: 'SETOR NEON',      cor: '#00ffff', fundo: 'cyber'  },
  { nome: 'GLACIAL',   tema: 'ZONA DE GELO',    cor: '#88ccff', fundo: 'gelo'   },
  { nome: 'INFERNAL',  tema: 'NÚCLEO DE FOGO',  cor: '#ff6600', fundo: 'fogo'   },
  { nome: 'SOMBRIO',   tema: 'DIMENSÃO SOMBRA', cor: '#aa44ff', fundo: 'sombra' },
  { nome: 'ROBÓTICO',  tema: 'GRID DIGITAL',    cor: '#00ff88', fundo: 'digital'},
  { nome: 'VOID',      tema: 'O VAZIO ETERNO',  cor: '#ff00ff', fundo: 'void'   },
];

var TOTAL_MAPAS = 6;
var _mapaMenu = 1;
var _mapaAtualBloqueado = false;

function getMapaDesbloqueado() {
  return Number(localStorage.getItem("mapaDesbloqueado")) || 1;
}

function getMapaDestaqueDia() {
  var hoje = new Date();
  var diaDoAno = Math.floor((hoje - new Date(hoje.getFullYear(), 0, 0)) / 86400000);
  return (diaDoAno % TOTAL_MAPAS) + 1;
}
var MAPA_DESTAQUE = getMapaDestaqueDia();

function vibrar(padrao) {
  try { if (navigator.vibrate) navigator.vibrate(padrao); } catch (e) {}
}

var _audioCtx = null;
function beepNegado() {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var t = _audioCtx.currentTime;
    [220, 160].forEach(function(freq, i) {
      var osc = _audioCtx.createOscillator();
      var gain = _audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.09);
      gain.gain.setValueAtTime(0.05, t + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.12);
      osc.connect(gain).connect(_audioCtx.destination);
      osc.start(t + i * 0.09);
      osc.stop(t + i * 0.09 + 0.13);
    });
  } catch (e) {}
}

var _negadoTimeoutFlash = null, _negadoTimeoutToast = null;
var _hudCorners = null;
function mostrarAcessoNegado(mapaExigido) {
  if (!_hudCorners) {
    _hudCorners = [document.getElementById('hudTL'), document.getElementById('hudTR'), document.getElementById('hudBL'), document.getElementById('hudBR')];
  }
  var tela = document.getElementById('startScreen');
  tela.classList.remove('tremendo'); void tela.offsetWidth; tela.classList.add('tremendo');

  var flash = document.getElementById('flashNegado');
  flash.classList.remove('ativo'); void flash.offsetWidth; flash.classList.add('ativo');

  var toast = document.getElementById('negadoToast');
  toast.textContent = 'DESBLOQUEIE O MAPA ' + (mapaExigido < 10 ? '0' + mapaExigido : mapaExigido) + ' PRIMEIRO';
  clearTimeout(_negadoTimeoutToast);
  toast.classList.add('ativo');
  _negadoTimeoutToast = setTimeout(function() { toast.classList.remove('ativo'); }, 1800);

  _hudCorners.forEach(function(c) { c.classList.add('alerta'); });
  clearTimeout(_negadoTimeoutFlash);
  _negadoTimeoutFlash = setTimeout(function() {
    _hudCorners.forEach(function(c) { c.classList.remove('alerta'); });
  }, 900);

  vibrar([40, 60, 40]);
  beepNegado();
}

function dispararShockwave(cor) {
  var onda = document.createElement('div');
  onda.className = 'shockwave';
  onda.style.setProperty('--sw-cor', cor);
  document.body.appendChild(onda);
  onda.addEventListener('animationend', function() { onda.remove(); });
}


var _mapaRecemDesbloqueado = 0;
function verificarMapaRecemDesbloqueado() {
  var atual = getMapaDesbloqueado();
  var visto = Number(localStorage.getItem('ultimoMapaVistoNoMenu')) || 1;
  if (atual > visto) {
    _mapaRecemDesbloqueado = atual;
  }
  localStorage.setItem('ultimoMapaVistoNoMenu', atual);
}

var _coresConfete = ['#00ffff', '#ffd700', '#ff00ff', '#00ff88', '#ff6600', '#aa44ff'];
function dispararConfete(qtd) {
  for (var i = 0; i < qtd; i++) {
    (function() {
      var c = document.createElement('div');
      c.className = 'confete';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = _coresConfete[Math.floor(Math.random() * _coresConfete.length)];
      var duracao = 1.7 + Math.random() * 1.1;
      c.style.animationDuration = duracao + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function() { c.remove(); }, (duracao + 0.5) * 1000);
    })();
  }
}

function atualizarStreakDiario() {
  var hoje = new Date().toISOString().slice(0, 10);
  var ultima = localStorage.getItem('streakUltimaData');
  var streak = Number(localStorage.getItem('streakDias')) || 0;
  if (ultima !== hoje) {
    var ontem = new Date();
    ontem.setDate(ontem.getDate() - 1);
    var ontemStr = ontem.toISOString().slice(0, 10);
    streak = (ultima === ontemStr) ? streak + 1 : 1;
    localStorage.setItem('streakDias', streak);

var _primeiraRenderizacaoCards = true;
function posicionarCards() {
  _cardEls.forEach(function(card, idx) {
    var i = idx + 1;
    var diff = i - _mapaMenu;
    var transform, opacity, z;

    if (diff === 0) {
      transform = "translateY(0px) scale(1.1) rotateY(0deg)";
      opacity = 1;
      z = 60;
    } else if (diff === -1) {
      // mapa anterior: espia em cima, menor e apagado
      transform = "translateY(-108px) scale(0.78) rotateY(0deg)";
      opacity = 1;
      z = 40;
    } else if (diff === 1) {
      // próximo mapa: espia embaixo, menor e apagado
      transform = "translateY(108px) scale(0.78) rotateY(0deg)";
      opacity = 0.55;
      z = 40;
    } else if (diff < -1) {
      transform = "translateY(-140px) scale(0.8) rotateY(0deg)";
      opacity = 0;
      z = 10;
    } else {
      transform = "translateY(140px) scale(0.8) rotateY(0deg)";
      opacity = 0;
      z = 10;
    }

    card.style.transform = transform;
    card.style.opacity = opacity;
    card.style.zIndex = z;
    card.style.pointerEvents = diff === 0 ? "auto" : "none";
    card.classList.toggle("mapa-card--frente", diff === 0);
    card.classList.remove("mapa-card--assentado");
  });

  var frente = _cardEls[_mapaMenu - 1];
  if (frente) {
    if (_primeiraRenderizacaoCards) {
      frente.classList.add("mapa-card--assentado");
    } else {
      var aoTerminar = function(e) {
        if (e.propertyName !== "transform" || e.target !== frente) return;
        frente.classList.add("mapa-card--assentado");
        frente.removeEventListener("transitionend", aoTerminar);
      };
      frente.addEventListener("transitionend", aoTerminar);
    }
  }
  _primeiraRenderizacaoCards = false;
}

(function configurarSwipe() {
  var area = document.getElementById("mapaCardsArea");
  var xInicial = null, yInicial = null, arrastando = false;
  var timerLongPress = null, longPressDisparado = false;
  var frenteArrastada = null, ultimoSpark = 0;

  function limparLongPress() {
    clearTimeout(timerLongPress);
    timerLongPress = null;
  }

  area.addEventListener("touchstart", function(e) {
    if (!e.touches || !e.touches.length) return;
    xInicial = e.touches[0].clientX;
    yInicial = e.touches[0].clientY;
    arrastando = true;
    longPressDisparado = false;
    frenteArrastada = _cardEls[_mapaMenu - 1] || null;
    if (frenteArrastada) frenteArrastada.classList.add("mapa-card--arrastando");

    limparLongPress();
    timerLongPress = setTimeout(function() {
      if (_mapaAtualBloqueado) {
        longPressDisparado = true;
        mostrarAcessoNegado(getMapaDesbloqueado());
      }
    }, 550);
  }, { passive: true });

  area.addEventListener("touchmove", function(e) {
    if (!arrastando || xInicial === null || !e.touches || !e.touches.length) return;
    var toque = e.touches[0];
    var dx = toque.clientX - xInicial;
    var dy = toque.clientY - yInicial;
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) limparLongPress();

    if (frenteArrastada && Math.abs(dx) > Math.abs(dy)) {
      var dxClamp = Math.max(-160, Math.min(160, dx));
      frenteArrastada.style.transform =
        "translateX(" + (dxClamp * 0.55) + "px) rotateY(" + (-dxClamp * 0.06) + "deg) scale(" + (1 - Math.abs(dxClamp) / 1600) + ")";

      var agora = Date.now();
      if (agora - ultimoSpark > 70) {
        ultimoSpark = agora;
        var mapaAtual = MAPAS[_mapaMenu - 1];
        criarSpark(toque.clientX, toque.clientY, mapaAtual ? mapaAtual.cor : '#00ffff');
      }
    }
  }, { passive: true });

  area.addEventListener("touchend", function(e) {
    limparLongPress();
    if (frenteArrastada) frenteArrastada.classList.remove("mapa-card--arrastando");
    if (!arrastando || xInicial === null) { arrastando = false; frenteArrastada = null; return; }
    arrastando = false;
    if (longPressDisparado) { xInicial = null; yInicial = null; frenteArrastada = null; posicionarCards(); return; }
    var toque = (e.changedTouches && e.changedTouches[0]) || null;
    if (!toque) { frenteArrastada = null; return; }
    var dx = toque.clientX - xInicial;
    var dy = toque.clientY - yInicial;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      if (dx < 0) irProximo(); else irAnterior();
    } else {
      posicionarCards();
    }
    xInicial = null; yInicial = null;
    frenteArrastada = null;
  }, { passive: true });
})();

var planetaCanvas = document.getElementById("planetaCanvas");

var planetaTempo = 0;
var planetaUltimoFrame = performance.now();

var corPortalAtualRGB = hexParaRgb(MAPAS[0].cor);
var corPortalAlvoRGB  = hexParaRgb(MAPAS[0].cor);

// Heurística simples de qualidade: aparelhos com poucos núcleos de CPU
// (comum em Android de entrada rodando WebView) ganham menos partículas
// nos dois canvases de fundo, o que é o maior custo de CPU/GPU da tela.
var _fatorQualidade = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ? 0.6 : 1;

function resetPlanetaParticula(part) {
  part.angle = Math.random() * Math.PI * 2;
  part.dist = Math.random() * 40 + 90;
  part.speed = Math.random() * 0.015 + 0.008;
  part.radialSpeed = Math.random() * 0.7 + 0.4;
  part.size = Math.random() * 1.8 + 0.6;
  part.alpha = Math.random() * 0.5 + 0.5;
  return part;
}

function hexParaRgb(hex) {
  hex = hex.replace('#', '');
  return {
    r: parseInt(hex.substring(0, 2), 16),
    g: parseInt(hex.substring(2, 4), 16),
    b: parseInt(hex.substring(4, 6), 16)
  };
}

function rgbParaCss(rgb, alpha) {

}

  planetaCanvas.width = rect.width * planetaDpr;
  planetaCanvas.height = rect.height * planetaDpr;

resizePlanetaCanvas();

function desenharPlaneta() {
  var w = planetaCanvas.width, h = planetaCanvas.height;
  var cx = w / 2, cy = h / 2;
  var r = Math.min(w, h) * 0.34;

  planetaCtx.clearRect(0, 0, w, h);
  planetaCtx.save();
  planetaCtx.translate(cx, cy);
  planetaCtx.globalCompositeOperation = 'lighter';

  var respiro = 1 + Math.sin(planetaTempo * 1.3) * 0.06;
  var nucleo = planetaCtx.createRadialGradient(0, 0, 0, 0, 0, r * 0.75 * respiro);
  nucleo.addColorStop(0, rgbParaCss(corPortalAtualRGB, 0.9));
  nucleo.addColorStop(0.35, rgbParaCss(corPortalAtualRGB, 0.5));
  nucleo.addColorStop(1, rgbParaCss(corPortalAtualRGB, 0));
  planetaCtx.fillStyle = nucleo;
  planetaCtx.beginPath();
  planetaCtx.arc(0, 0, r * 0.9 * respiro, 0, Math.PI * 2);
  planetaCtx.fill();

  for (var i = 0; i < 3; i++) {
    planetaCtx.save();
    var spin = planetaTempo * (i % 2 === 0 ? 0.35 : -0.25) + i * 1.4;
    planetaCtx.rotate(spin);
    planetaCtx.strokeStyle = rgbParaCss(corPortalAtualRGB, 0.28 - i * 0.06);
    planetaCtx.lineWidth = (2.5 - i * 0.5) * planetaDpr;
    planetaCtx.setLineDash([r * 0.25, r * 0.12, r * 0.5, r * 0.15]);
    planetaCtx.beginPath();
    planetaCtx.arc(0, 0, r * (0.7 + i * 0.14), 0, Math.PI * 2);
    planetaCtx.stroke();
    planetaCtx.restore();

    part.angle += part.speed;
    part.dist -= part.radialSpeed;
    if (part.dist < 4) resetPlanetaParticula(part);

    var px = Math.cos(part.angle) * part.dist * planetaDpr;
    var py = Math.sin(part.angle) * part.dist * planetaDpr;

    planetaCtx.globalAlpha = part.alpha * (part.dist / 130);
    planetaCtx.fillStyle = rgbParaCss(corPortalAtualRGB, 1);
    planetaCtx.beginPath();
    planetaCtx.arc(px, py, part.size * planetaDpr, 0, Math.PI * 2);
    planetaCtx.fill();
  });

}

  planetaUltimoFrame = agora;
  planetaTempo += dt;

  var fatorLerp = Math.min(dt * 4, 1);
  corPortalAtualRGB.r += (corPortalAlvoRGB.r - corPortalAtualRGB.r) * fatorLerp;
  corPortalAtualRGB.g += (corPortalAlvoRGB.g - corPortalAtualRGB.g) * fatorLerp;
  corPortalAtualRGB.b += (corPortalAlvoRGB.b - corPortalAtualRGB.b) * fatorLerp;

  _planetaSkip++;

function criarParticulasBg(tipo, cor) {

  for (var i = 0; i < qtd; i++) {

    } else if (tipo === "gelo") {

    } else if (tipo === "fogo") {
      bgParticles.push({ x: Math.random()*W, y: H+Math.random()*H, r: Math.random()*2+0.5, spd: Math.random()*2+1, drift: (Math.random()-0.5)*1, alpha: Math.random()*0.6+0.2, pulse: Math.random()*Math.PI*2, color: Math.random()>0.5?"#ff6600":"#ffaa00" });
    } else if (tipo === "sombra") {
      bgParticles.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*3+1, spd: Math.random()*0.3+0.1, drift: (Math.random()-0.5)*0.4, alpha: Math.random()*0.3+0.05, pulse: Math.random()*Math.PI*2, dir: Math.random()>0.5?1:-1 });
    } else if (tipo === "digital") {
      bgParticles.push({ x: Math.random()*W, y: Math.random()*H, w: Math.random()*25+5, h: Math.random()*2+1, spd: Math.random()*3+1, alpha: Math.random()*0.15+0.03 });
    } else if (tipo === "void") {
      bgParticles.push({ x: Math.random()*W, y: Math.random()*H, radius: Math.random()*80+20, angle: Math.random()*Math.PI*2, spd: (Math.random()*0.01+0.003)*(Math.random()>0.5?1:-1), alpha: Math.random()*0.1+0.02, size: Math.random()*40+10 });

    else if (bgTipoAtual === "gelo")   { grad.addColorStop(0,"#001428"); grad.addColorStop(1,"#000810"); }
    else if (bgTipoAtual === "fogo")   { grad.addColorStop(0,"#150300"); grad.addColorStop(1,"#080000"); }
    else if (bgTipoAtual === "sombra") { grad.addColorStop(0,"#0a0015"); grad.addColorStop(1,"#040008"); }
    else if (bgTipoAtual === "digital"){ grad.addColorStop(0,"#001208"); grad.addColorStop(1,"#000805"); }
    else if (bgTipoAtual === "void")   { grad.addColorStop(0,"#050005"); grad.addColorStop(1,"#000000"); }
    _bgGradCache = { key: gradKey, gradient: grad };
  }
  bgCtx.fillStyle = _bgGradCache.gradient;
  bgCtx.save();
  bgCtx.globalAlpha = 0; // deixa ~18% da imagem de fundo (cidade-cyberpunk.png) aparecer por trás
  bgCtx.fillRect(0, 0, W, H);
  bgCtx.restore();

  bgCtx.strokeStyle = bgCorAtual + "0a";
  bgCtx.lineWidth = 0.5;
  var gs = 50, off = (Date.now()*0.02)%gs;
  bgCtx.beginPath();
  for (var y = -gs+off; y < H; y+=gs) { bgCtx.moveTo(0,y); bgCtx.lineTo(W,y); }
  for (var x = 0; x < W; x+=gs) { bgCtx.moveTo(x,0); bgCtx.lineTo(x,H); }
  bgCtx.stroke();

  bgParticles.forEach(function(p) {
    if (bgTipoAtual === "cyber") {
      p.y -= p.spd; p.x += p.drift; p.pulse += 0.02;
      if (p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
      bgCtx.save(); bgCtx.globalAlpha = p.alpha*(0.7+Math.sin(p.pulse)*0.3);
      bgCtx.fillStyle = bgCorAtual; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bgCtx.fill(); bgCtx.restore();
    } else if (bgTipoAtual === "gelo") {
      p.y += p.spd; p.x += p.drift; p.pulse += 0.015;
      if (p.y > H+10) { p.y = -10; p.x = Math.random()*W; }
      bgCtx.save(); bgCtx.globalAlpha = p.alpha*(0.8+Math.sin(p.pulse)*0.2);
      bgCtx.fillStyle = "#aaddff"; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bgCtx.fill();
      bgCtx.strokeStyle="#cceeff"; bgCtx.lineWidth=0.5; bgCtx.globalAlpha*=0.4;
      bgCtx.beginPath(); bgCtx.moveTo(p.x-p.r*1.5,p.y); bgCtx.lineTo(p.x+p.r*1.5,p.y); bgCtx.stroke();
      bgCtx.beginPath(); bgCtx.moveTo(p.x,p.y-p.r*1.5); bgCtx.lineTo(p.x,p.y+p.r*1.5); bgCtx.stroke();
      bgCtx.restore();
    } else if (bgTipoAtual === "fogo") {
      p.y -= p.spd; p.x += p.drift; p.pulse += 0.04;
      if (p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
      bgCtx.save(); bgCtx.globalAlpha = p.alpha*(0.6+Math.sin(p.pulse)*0.4);
      bgCtx.fillStyle = p.color; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bgCtx.fill(); bgCtx.restore();
    } else if (bgTipoAtual === "sombra") {
      p.pulse += 0.006; p.x += Math.sin(p.pulse+p.y*0.01)*p.spd*p.dir; p.y += Math.cos(p.pulse)*p.spd*0.5;
      if (p.x<-50)p.x=W+50; if (p.x>W+50)p.x=-50; if (p.y<-50)p.y=H+50; if (p.y>H+50)p.y=-50;
      bgCtx.save(); bgCtx.globalAlpha = Math.max(0,p.alpha*(0.5+Math.sin(p.pulse*2)*0.5));
      bgCtx.fillStyle = "#8800ff"; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bgCtx.fill(); bgCtx.restore();
    } else if (bgTipoAtual === "digital") {
      p.y += p.spd; if (p.y > H+10) { p.y = -10; p.x = Math.random()*W; }
      bgCtx.save(); bgCtx.globalAlpha = p.alpha; bgCtx.fillStyle = bgCorAtual;
      bgCtx.fillRect(p.x, p.y, p.w, p.h); bgCtx.restore();
    } else if (bgTipoAtual === "void") {
      p.angle += p.spd;
      var cx = p.x + Math.cos(p.angle)*p.radius, cy = p.y + Math.sin(p.angle)*p.radius;
      bgCtx.save(); bgCtx.globalAlpha = p.alpha*(0.5+Math.sin(p.angle*2)*0.5);
      bgCtx.strokeStyle = "#ff00ff"; bgCtx.lineWidth = 1;
      bgCtx.beginPath(); bgCtx.arc(cx, cy, p.size, 0, Math.PI*2); bgCtx.stroke(); bgCtx.restore();
    }
  });

  var vigKey = W + "_" + H;
  if (!_vigGradCache || _vigGradCache.key !== vigKey) {
    var vig = bgCtx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
    vig.addColorStop(0,"transparent"); vig.addColorStop(1,"rgba(0,0,0,0.55)");
    _vigGradCache = { key: vigKey, gradient: vig };
  }
  bgCtx.fillStyle = _vigGradCache.gradient;
  bgCtx.fillRect(0,0,W,H);
}

function hidratarLocalStorage(perfil, nomeConta) {
  if (!perfil) {
    localStorage.setItem('mapaDesbloqueado', 1);
    localStorage.setItem('naveAtual', 'padrao');
    localStorage.setItem('navesCompradas', JSON.stringify(['padrao']));
    localStorage.setItem('moedas', 0);
    for (var m = 1; m <= 6; m++) localStorage.setItem('nivelDesbloqueado_mapa' + m, 1);
    localStorage.setItem('joiasMochila', JSON.stringify([]));
    localStorage.setItem('joiasEquipadas', JSON.stringify({}));
    localStorage.setItem('joiaNexusComprada', 'false');
    localStorage.setItem('vanguardPartes', JSON.stringify({}));
    localStorage.setItem('vanguardSkinsCompradas', JSON.stringify([]));
    return;
  }
  var p = perfil.progresso || {};
  var n = perfil.naves || {};
  var v = perfil.vanguard || {};
  var c = perfil.configuracoes || {};

  if (typeof p.mapaDesbloqueado !== 'undefined') {
    var mapaLocalAtual = Number(localStorage.getItem('mapaDesbloqueado')) || 1;
    localStorage.setItem('mapaDesbloqueado', Math.max(mapaLocalAtual, p.mapaDesbloqueado));
  }
  if (typeof p.naveAtual !== 'undefined') localStorage.setItem('naveAtual', p.naveAtual);
  if (typeof p.navesCompradas !== 'undefined') localStorage.setItem('navesCompradas', JSON.stringify(p.navesCompradas));
  if (typeof p.moedas !== 'undefined') localStorage.setItem('moedas', p.moedas);
  // Joia Nexus: espelha a compra da conta (a partida lê isso do localStorage)
  localStorage.setItem('joiaNexusComprada', p.joiaNexusComprada === true ? 'true' : 'false');
  if (p.niveisDesbloqueados) {
    Object.keys(p.niveisDesbloqueados).forEach(function(mapaNum) {
      var chave = 'nivelDesbloqueado_mapa' + mapaNum;
      var localAtual = Number(localStorage.getItem(chave)) || 1;
      localStorage.setItem(chave, Math.max(localAtual, p.niveisDesbloqueados[mapaNum]));
    });
  }
  if (typeof n.joiasMochila !== 'undefined') localStorage.setItem('joiasMochila', JSON.stringify(n.joiasMochila));
  if (typeof n.joiasEquipadas !== 'undefined') localStorage.setItem('joiasEquipadas', JSON.stringify(n.joiasEquipadas));
  if (typeof v.partesEquipadas !== 'undefined') localStorage.setItem('vanguardPartes', JSON.stringify(v.partesEquipadas));
  if (typeof v.skinsCompradas !== 'undefined') localStorage.setItem('vanguardSkinsCompradas', JSON.stringify(v.skinsCompradas));
  if (typeof c.modoControle !== 'undefined') localStorage.setItem('modoControle', c.modoControle);
  if (typeof c.modoProfundidade !== 'undefined') localStorage.setItem('modoProfundidade', c.modoProfundidade);
  if (perfil.conquistas && nomeConta) {
    localStorage.setItem('neonraiders_conquistas_' + nomeConta, JSON.stringify(perfil.conquistas));
  }
}

onAuthStateChanged(auth, async (user) => {

      }).catch(() => {});
      await window.NRDados.salvarNaves({ joiasMochila: [], joiasEquipadas: {} }).catch(() => {});
      await window.NRDados.salvarVanguard({ partesEquipadas: {}, skinsCompradas: [] }).catch(() => {});

    }

    var _mapaRecemAntes = _mapaRecemDesbloqueado;

<div id="fpsCounter" style="position:fixed;top:57px;left:0;z-index:99999;background:#404040; border:none; padding:2px 4px; border-radius:0px 6px 6px 0px; color:#0f0;font-family:'Share Tech Mono',monospace;font-size:1px;pointer-events:none;"><i></i><b>--</b><small>FPS</small></div>
<script>
(function() {
  var el = document.getElementById('fpsCounter');
  var frames = 0, ultimo = performance.now(), fps = 0;
  function loop(agora) {
    frames++;
    if (agora - ultimo >= 500) {
      fps = Math.round((frames * 1000) / (agora - ultimo));
      el.innerHTML = '<i></i><b>' + fps + '</b><small>FPS</small>'; // (novo visual: bolinha + número + FPS; a cor continua vindo de el.style.color)
      el.style.color = fps >= 50 ? '#22ff66' : (fps >= 30 ? '#ffdd33' : '#ff4444');
      frames = 0;
      ultimo = agora;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
