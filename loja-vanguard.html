<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title></title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; background:#02000a; color:#fff;
    font-family:'Orbitron',monospace; overflow-x:hidden;
  }

  #topo {
    position:relative; width:100%; height:38vh; min-height:260px;
    background:radial-gradient(ellipse at center, #0d0730 0%, #020006 100%);
    overflow:hidden;
  }
  #previewCanvas { position:absolute; inset:0; width:100%; height:100%; }

  #hudTopo {
    position:absolute; top:4px; left:0; right:0px;
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-direction:column;
    gap:4px;
  }
  #moedasWrap {
    font-family:'Share Tech Mono',monospace; font-size:10px; color:#ffd700;
    text-shadow:0 0 10px #ffd70088; letter-spacing:2px;
    background:rgba(0,0,0,0.4); border:1px solid #ffd70044; border-radius:10px;
    padding:3px 10px;
  }
  #btnmenu {
    font-family:'Orbitron',monospace; font-size:1px; font-weight:700; letter-spacing:1px;
    padding:6px 8px; border-radius:10px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15); color:#ffffff88; cursor:pointer;
    
  }
  #btnSair {
    font-family:'Orbitron',monospace; font-size:1px; font-weight:700; letter-spacing:1px;
    padding:6px 8px; border-radius:10px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15); color:#ffffff88; cursor:pointer;
  }
  #tituloNave {
    text-align:center; position:absolute; bottom:0px; left:0; right:0;
  }
  #tituloNave .n { font-size:clamp(7px,1.1vw,2px); font-weight:900; letter-spacing:3px; color:#40daf2; text-shadow:0 0 14px #40daf2; }
  #tituloNave .s { font-family:'Share Tech Mono',monospace; font-size:1px; letter-spacing:2px; color:#cf54c9cc;  }

  #statsBar {
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    padding:12px 14px; background:#080415; border-bottom:1px solid #ffffff11;
  }
  .stat-chip {
    font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px;
    padding:6px 10px; border-radius:100px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12); white-space:nowrap;
  }
  .stat-chip b { color:#40daf2; }

  #abas {
    display:flex; overflow-x:auto; gap:6px; padding:12px 14px;
    background:#050310; border-bottom:1px solid #ffffff11;
    scroll-snap-type: x proximity;
  }
  .aba {
    flex:0 0 auto; font-family:'Orbitron',monospace; font-size:9px; font-weight:700;
    letter-spacing:0.5px; padding:9px 11px; border-radius:10px; cursor:pointer;
    background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.1);
    color:#ffffff88; white-space:nowrap; transition:all .2s;
  }
  .aba.ativa {
    color:#02000a; background:linear-gradient(135deg,#40daf2,#cf54c9);
    border-color:transparent; box-shadow:0 0 16px #40daf288;
  }

  #listaSkins { padding:14px; display:flex; flex-direction:column; gap:10px; padding-bottom:60px; }

  .skin-card {
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.1);
    border-radius:14px; padding:12px;
    transition:border-color .2s, background .2s;
  }
  .skin-card.equipada { border-color:#40daf2; background:rgba(64,218,242,0.08); }

  .skin-amostra {
    flex:0 0 auto; width:52px; height:52px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:#000; border:1px solid rgba(255,255,255,0.12);
  }
  .skin-info { flex:1; min-width:0; }
  .skin-nome { font-size:12px; font-weight:700; letter-spacing:1px; }
  .skin-bonus { font-family:'Share Tech Mono',monospace; font-size:10px; color:#8fffb0; margin-top:3px; }
  .skin-bonus.vazio { color:#ffffff44; }

  .skin-acoes { flex:0 0 auto; display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .btn-skin {
    font-family:'Orbitron',monospace; font-size:9px; font-weight:700; letter-spacing:1px;
    padding:8px 12px; border-radius:8px; border:none; cursor:pointer; white-space:nowrap;
  }
  .btn-comprar { background:linear-gradient(135deg,#ffd700,#ff9d00); color:#000; }
  .btn-comprar:disabled { background:rgba(255,255,255,0.06); color:#ffffff33; pointer-events:none; }
  .btn-equipar { background:linear-gradient(135deg,#40daf2,#00aaff); color:#000; }
  .btn-equipada { background:rgba(64,218,242,0.15); color:#40daf2; border:1px solid #40daf2; pointer-events:none; }
  .btn-som { background:rgba(207,84,201,0.15); color:#cf54c9; border:1px solid #cf54c9; }

  /* Tela de bloqueio (se alguém cair aqui sem ter comprado a nave) */
  #telaBloqueada {
    position:fixed; inset:0; z-index:999; background:#02000a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; text-align:center;
  }
  #telaBloqueada .cadeado { font-size:48px; }
  #telaBloqueada .msg { font-family:'Share Tech Mono',monospace; font-size:12px; color:#ffffff88; letter-spacing:1px; max-width:280px; line-height:1.6; }
  #telaBloqueada button {
    font-family:'Orbitron',monospace; font-size:11px; font-weight:700; letter-spacing:2px;
    padding:14px 28px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#40daf2,#cf54c9); color:#000;
  }
</style>
</head>

<!-- Trava de acesso: só passa quem já comprou a nave no hangar -->
<div id="telaBloqueada" style="display:none;">
  <div class="cadeado">🔒</div>
  <div class="msg">Você precisa comprar a NR-01 Vanguard no Hangar antes de acessar a customização.</div>
  <button onclick="window.location.href='loja.html'">◈ IR PRO HANGAR</button>
</div>

<div id="conteudo" style="display:none;">
  <div id="topo">
    <canvas id="previewCanvas"></canvas>
    <div id="hudTopo">
      <div id="moedasWrap">◈ <span id="moedasValor">0</span></div>
      <button id="btnmenu" onclick="window.location.href='menu.html'">⌂ MENU</button>
      <button id="btnSair" onclick="window.location.href='loja.html'">✕ SAIR</button>
    </div>
    <div id="tituloNave">
      <div class="n">NR-01 VANGUARD</div>
      <div class="s">CUSTOMIZAÇÃO MODULAR</div>
    </div>
  </div>

  <div id="statsBar"></div>
  <div id="abas"></div>
  <div id="tituloParteAtiva" style="padding:12px 14px 0; font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; color:#ffffff66;"></div>
  <div id="listaSkins"></div>
</div>

<script src="dados.js"></script>
<script src="vanguard-core.js"></script>
<script>
let canvas, ctx, dpr;

function getMoedas() { return Number(localStorage.getItem('moedas')) || 0; }
function setMoedas(v) {
  localStorage.setItem('moedas', String(Math.max(0,v)));
  atualizarMoedasUI();
}

function atualizarMoedasUI() {
  const el = document.getElementById('moedasValor');
  if (el) el.textContent = getMoedas();
}

function renderStatsBar() {
  const totais = vanguardCalcularStatsTotais();
  const LABELS = { dano:'DANO', velocidade:'VELOCIDADE', hp:'HP', cadencia:'CADÊNCIA', critico:'CRÍTICO' };
  const el = document.getElementById('statsBar');
  el.innerHTML = '';
  Object.entries(totais).forEach(([k,v]) => {
    if (v === 0) return;
    const chip = document.createElement('div');
    chip.className = 'stat-chip';
    const sinal = v > 0 ? '+' : '';
    const valor = (k==='hp') ? `${sinal}${v}` : `${sinal}${Math.round(v*100)}%`;
    chip.innerHTML = `${LABELS[k]}: <b>${valor}</b>`;
    el.appendChild(chip);
  });
  if (!el.children.length) el.innerHTML = '<div class="stat-chip">Nenhum bônus ativo ainda</div>';
}

let parteAtiva = 'bico';

// Nomes curtos só pras abas (a tela é estreita e "PONTAS DE ASA" não cabia
// sem cortar) — o nome completo continua em VANGUARD_NOMES_PARTES pra
// qualquer outro lugar que precise dele
const NOMES_ABAS_CURTO = {
  bico: 'BICO', asas: 'ASAS', pontaAsa: 'PONTAS',
  cauda: 'CAUDA', casco: 'CASCO',
};

function renderAbas() {
  const el = document.getElementById('abas');
  el.innerHTML = '';
  VANGUARD_ORDEM_PARTES.forEach(parte => {
    const btn = document.createElement('div');
    btn.className = 'aba' + (parte===parteAtiva ? ' ativa' : '');
    btn.textContent = NOMES_ABAS_CURTO[parte];
    btn.onclick = () => { parteAtiva = parte; renderTudo(); };
    el.appendChild(btn);
  });
}

function desenharAmostraSkin(canvas, parte, skin) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.translate(w/2, h/2);
  const escala = 0.11;
  ctx.scale(escala, escala);
  VANGUARD_GEOMETRIA[parte].forEach(([id, familia, pontosBase]) => {
    const cor = skin.paleta[familia] || VANGUARD_CORES_PADRAO[familia];
    const pontos = skin.transformar ? pontosBase.map(([x,y]) => {
      const t = skin.transformar;
      const ex=t.escalaX??1, ey=t.escalaY??1, ox=t.origemX??0, oy=t.origemY??0;
      return [(x-ox)*ex+ox, (y-oy)*ey+oy];
    }) : pontosBase;
    ctx.fillStyle = cor;
    ctx.beginPath();
    ctx.moveTo(pontos[0][0], pontos[0][1]);
    for (let i=1;i<pontos.length;i++) ctx.lineTo(pontos[i][0], pontos[i][1]);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();
}

function renderListaSkins() {
  document.getElementById('tituloParteAtiva').textContent = '▶ ' + VANGUARD_NOMES_PARTES[parteAtiva];
  const el = document.getElementById('listaSkins');
  el.innerHTML = '';
  const equipadaAtual = vanguardGetSkinEquipada(parteAtiva);

  VANGUARD_SKINS[parteAtiva].forEach(skin => {
    const card = document.createElement('div');
    card.className = 'skin-card' + (skin.id === equipadaAtual.id ? ' equipada' : '');

    const amostra = document.createElement('canvas');
    amostra.width = 104; amostra.height = 104;
    amostra.className = 'skin-amostra';
    card.appendChild(amostra);

    const info = document.createElement('div');
    info.className = 'skin-info';
    const bonusTxt = Object.entries(skin.bonus).map(([k,v]) => {
      const sinal = v>0?'+':'';
      return k==='hp' ? `${sinal}${v} HP` : `${sinal}${Math.round(v*100)}% ${k}`;
    }).join(' · ');
    info.innerHTML = `
      <div class="skin-nome">${skin.nome}</div>
      <div class="skin-bonus ${bonusTxt?'':'vazio'}">${bonusTxt || 'Sem bônus — visual padrão'}</div>
    `;
    card.appendChild(info);

    const acoes = document.createElement('div');
    acoes.className = 'skin-acoes';

    if (skin.id === equipadaAtual.id) {
      const b = document.createElement('button');
      b.className = 'btn-skin btn-equipada';
      b.textContent = '✓ EQUIPADA';
      acoes.appendChild(b);
    } else if (vanguardSkinJaComprada(skin)) {
      const b = document.createElement('button');
      b.className = 'btn-skin btn-equipar';
      b.textContent = 'EQUIPAR';
      b.onclick = () => { vanguardSetParteEquipada(parteAtiva, skin.id); renderTudo(); };
      acoes.appendChild(b);
    } else {
      const b = document.createElement('button');
      b.className = 'btn-skin btn-comprar';
      b.textContent = `◈ ${skin.preco}`;
      b.disabled = getMoedas() < skin.preco;
      b.onclick = () => {
        const moedas = getMoedas();
        if (moedas < skin.preco) return;
        setMoedas(moedas - skin.preco);
        vanguardComprarSkin(skin.id);
        vanguardSetParteEquipada(parteAtiva, skin.id);
        renderTudo();
      };
      acoes.appendChild(b);
    }

    if (parteAtiva === 'cauda' && skin.som) {
      const bs = document.createElement('button');
      bs.className = 'btn-skin btn-som';
      bs.textContent = '♪ TESTAR SOM';
      bs.onclick = () => vanguardTocarSom(skin.som);
      acoes.appendChild(bs);
    }

    card.appendChild(acoes);
    el.appendChild(card);

    desenharAmostraSkin(amostra, parteAtiva, skin);
  });
}

function renderTudo() {
  atualizarMoedasUI();
  renderStatsBar();
  renderAbas();
  renderListaSkins();
}

// ── PREVIEW ANIMADO NO TOPO ─────────────────────────────────────
const estrelas = Array.from({length:60}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.4+0.4, a:Math.random()*0.6+0.2}));
let t=0, ultimo;

function resize() {
  dpr = Math.min(window.devicePixelRatio||1, 2);
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
}

function loop() {
  const agora = performance.now(); const dt=(agora-ultimo)/1000; ultimo=agora; t+=dt;
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#ffffff';
  estrelas.forEach(s => {
    ctx.globalAlpha = s.a*(0.6+Math.sin(t*2+s.x*10)*0.4);
    ctx.beginPath(); ctx.arc(s.x*w, s.y*h, s.r*dpr, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Quanto MAIOR esse número, MENOR a nave fica no preview
  const escalaBase = Math.min(w,h) / 1500;
  const flutua = Math.sin(t*1.2)*5*dpr;
  const respira = 1 + Math.sin(t*1.6)*0.015;
  desenharVanguardModular(ctx, w/2, h*0.46+flutua, escalaBase*respira*dpr, 0, true);

  requestAnimationFrame(loop);
}

function iniciarLojaVanguard() {
  canvas = document.getElementById('previewCanvas');
  ctx = canvas.getContext('2d');
  ultimo = performance.now();
  window.addEventListener('resize', resize);
  resize();
  renderTudo();
  loop();
}

// ── TRAVA DE ACESSO ────────────────────────────────────────────
// Fica no final do arquivo de propósito: só roda depois que todas as
// funções/variáveis acima já foram declaradas, evitando erro de
// "acessar antes de inicializar" (TDZ) do JavaScript.
if (!vanguardEstaDesbloqueada()) {
  document.getElementById('telaBloqueada').style.display = 'flex';
} else {
  document.getElementById('conteudo').style.display = 'block';
  iniciarLojaVanguard();
}
</script>
<script type="module" src="atualizacao.js"></script>
</body>
</html>
