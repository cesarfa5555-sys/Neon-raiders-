<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>NEON RAIDERS — Survival</title>
<link rel="stylesheet" href="jogo.css">
</head>
<body>

<!-- CENA 3D + camada 2D (números de dano, barras de vida sobre os personagens) -->
<canvas id="cena"></canvas>
<canvas id="overlay"></canvas>
<div id="vinhetaDano"></div>
<div id="vinhetaVida"></div>
<div id="flashTela"></div>

<!-- Área de toque para o joystick flutuante (cobre a tela toda, fica atrás dos botões) -->
<div id="zonaToque"></div>
<div id="joy"><div id="joyBase"></div><div id="joyBot"></div></div>

<!-- ═══════════ HUD ═══════════ -->
<div id="hud" class="oculto">
  <div id="xpBarra"><div id="xpPreench"></div><span id="xpTexto">NV 1</span></div>

  <div id="topo">
    <div class="pilula" id="boxOnda"><small>ONDA</small><b id="ondaNum">1</b><div id="ondaTempo"><i id="ondaTempoPreench"></i></div></div>
    <div class="pilula" id="boxTempo"><b id="tempoTxt">0:00</b></div>
    <div class="pilula" id="boxAbates"><span class="ic" data-ico="abates"></span><b id="abatesNum">0</b></div>
    <div class="pilula" id="boxSucata" style="display:none"><span class="ic" data-ico="sucata"></span><b id="sucataNum">0</b></div>
    <div class="pilula" id="boxMoedas"><span class="ic am" data-ico="moeda"></span><b id="moedasNum">0</b></div>
    <button id="btnPausa" class="btnIcone" aria-label="Pausar" data-ico="pausa"></button>
  </div>

  <div id="vidaBox">
    <div id="vidaBarra"><div id="vidaPreench"></div><div id="vidaPerda"></div></div>
    <span id="vidaTexto">130/130</span>
  </div>
  <div id="habs"></div>

  <div id="chefeBox" class="oculto">
    <div id="chefeNome">TITAN GOLIATH</div>
    <div id="chefeBarra"><div id="chefePreench"></div></div>
  </div>

  <div id="aliados"></div>
  <div id="banner"></div>
  <div id="aviso"></div>

  <button id="btnAtirar" class="oculto" aria-label="Atirar"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="6"/><path d="M20 3v8M20 29v8M3 20h8M29 20h8" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg><span>ATIRAR</span></button>
  <button id="btnPular" aria-label="Pular"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 8 L30 20 H23 V32 H17 V20 H10 Z"/></svg><span>PULAR</span></button>
  <button id="btnDash" aria-label="Dash"><svg viewBox="0 0 40 40"><circle id="dashAnel" cx="20" cy="20" r="17" /></svg><span>DASH</span></button>
</div>

<!-- CARTAS DE LEVEL UP -->
<div id="cartasTela" class="tela oculto">
  <div class="cartasTitulo"><small>NÍVEL ALCANÇADO</small><b id="cartasNivel">NÍVEL 2</b></div>
  <div id="cartasLista"></div>
  <div id="cartasTempo" class="oculto"><i id="cartasTempoPreench"></i></div>
  <div id="cartasEsperando" class="oculto">AGUARDANDO O SERVIDOR…</div>
</div>

<!-- LOJA ENTRE AS ONDAS (estilo Brotato) -->
<div id="lojaTela" class="tela oculto">
  <div id="lojaTopo">
    <div><small id="lojaSub">ONDA CONCLUÍDA</small><b id="lojaOnda">ONDA 1</b></div>
    <div class="pilula"><span class="ic" data-ico="sucata"></span><b id="lojaSucata">0</b><small>SUCATA</small></div>
    <div id="lojaTempo" class="oculto"></div>
  </div>
  <div id="lojaLista"></div>
  <div id="lojaBotoes"><button class="btn sec" id="lojaReroll">REROLAR</button><button class="btn" id="lojaPronto">PRÓXIMA ONDA</button></div>
</div>

<!-- PAUSA -->
<div id="pausaTela" class="tela oculto">
  <div class="painel">
    <h2>PAUSADO</h2>
    <button class="btn" id="pausaContinuar">CONTINUAR</button>
    <div class="linhaVol"><label>MÚSICA</label><input type="range" id="volMusica" min="0" max="1" step="0.05"></div>
    <div class="linhaVol"><label>EFEITOS</label><input type="range" id="volSfx" min="0" max="1" step="0.05"></div>
    <button class="btn sec" id="btnModoTiro">TIRO: AUTOMÁTICO</button>
    <button class="btn perigo" id="pausaSair">SAIR DA PARTIDA</button>
  </div>
</div>

<!-- RESULTADO -->
<div id="resultadoTela" class="tela oculto">
  <div class="painel largo">
    <small id="resMotivo">MISSÃO ENCERRADA</small>
    <h2 id="resTitulo">VOCÊ CAIU</h2>
    <div id="resOnda">ONDA <b>1</b></div>
    <div id="resGrade"></div>
    <div id="resRecompensa"></div>
    <div id="resExtra"></div>
    <div class="botoes">
      <button class="btn" id="resDeNovo">JOGAR DE NOVO</button>
      <button class="btn sec" id="resMenu">MENU</button>
    </div>
  </div>
</div>

<!-- CONTAGEM / CARREGANDO -->
<div id="contagem" class="oculto"></div>
<div id="carregando">
  <div class="logoCar">NEON RAIDERS</div>
  <div class="subCar">SURVIVAL PROTOCOL</div>
  <div id="carBarra"><i id="carPreench"></i></div>
  <div id="carTexto">Iniciando sistemas…</div>
  <div id="carDica"></div>
</div>

<script src="icones.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config-servidor.js"></script>
<script src="data.js"></script>
<script src="sim.js"></script>
<script src="codec.js"></script>
<script src="dados.js"></script>
<script src="level.js"></script>
<script src="perfil.js"></script>
<script src="xp.js"></script>
<script src="conta.js"></script>
<script src="audio.js"></script>
<script src="tiro-sintetizado.js"></script>
<script src="rede.js"></script>
<script src="anim-dados.js"></script>
<script src="animador.js"></script>
<script src="modelos.js"></script>
<script src="heroi-config.js"></script>
<script src="armas-glb.js"></script>
<script src="heroi-glb.js"></script>
<script src="mundo.js"></script>
<script src="efeitos.js"></script>
<script src="desenhista.js"></script>
<script src="controles.js"></script>
<script src="interface.js"></script>
<script src="partida.js"></script>
<script src="paisagem.js"></script>
</body>
</html>
