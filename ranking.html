<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>NEON RAIDERS — Ranking</title>
<link rel="stylesheet" href="base.css">
<style>
  #fundo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #tit { text-align: center; font-size: 20px; font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 16px var(--amarelo); margin: -4px 0 8px; }
  #lista { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr; gap: 6px; align-content: start; touch-action: pan-y; }
  .lin { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--vidro); border: 1px solid rgba(46, 230, 255, .25); border-left: 4px solid #3a4768; }
  .lin .pos { width: 38px; font-weight: 900; font-size: 18px; text-align: center; color: #9fb9d4; } .lin.p1 { border-left-color: #ffd23d; } .lin.p1 .pos { color: #ffd23d; text-shadow: 0 0 12px #ffd23d; } .lin.p2 { border-left-color: #cfd8e6; } .lin.p2 .pos { color: #cfd8e6; } .lin.p3 { border-left-color: #d98a4a; } .lin.p3 .pos { color: #d98a4a; }
  .lin .nm { flex: 1; min-width: 0; } .lin .nm b { display: block; font-size: 13px; letter-spacing: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .lin .nm small { font: 700 10px 'Share Tech Mono'; color: #9fb9d4; }
  .lin .pt { font-weight: 900; font-size: 15px; color: var(--ciano); text-shadow: 0 0 10px var(--ciano); } .lin.eu { background: rgba(255, 210, 61, .12); border-color: var(--amarelo); }
  #msg { text-align: center; font: 700 12px 'Share Tech Mono'; color: #9fb9d4; padding: 20px; }
  @media (orientation: landscape) { #lista { grid-template-columns: 1fr 1fr; gap: 6px 14px; } .pagina { padding-left: calc(12px + env(safe-area-inset-left, 0px)); padding-right: calc(12px + env(safe-area-inset-right, 0px)); } }
</style>
</head>
<body>
<canvas id="fundo"></canvas><div id="scan"></div>
<div class="pagina">
  <div class="barraTopo"><button class="btnIcone" id="btnVoltar" style="margin-right:auto" aria-label="Voltar" data-ico="voltar"></button></div>
  <div id="tit">RANKING GLOBAL</div>
  <div id="lista"><div id="msg">Carregando…</div></div>
</div>
<script src="icones.js"></script>
<script src="data.js"></script>
<script src="dados.js"></script>
<script src="guarda.js"></script>
<script src="conta.js"></script>
<script src="menu-cenario.js"></script>
<script src="ranking.js"></script>
<script src="paisagem.js"></script>
</body>
</html>
