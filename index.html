<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>NEON RAIDERS</title>
<link rel="stylesheet" href="base.css">
<style>
  #fundo { position: fixed; inset: 0; width: 100%; height: 100%; }
  #splash { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  #logoNektra { width: min(34vw, 150px); opacity: 0; animation: surge 1.4s .2s forwards; filter: drop-shadow(0 0 16px rgba(46, 230, 255, .6)); }
  #tit { font-size: clamp(30px, 8vw, 52px); font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 12px var(--ciano), 0 0 40px var(--rosa); opacity: 0; animation: surge 1.2s 1.3s forwards; }
  #sub { font-size: 11px; letter-spacing: 10px; color: var(--rosa); opacity: 0; animation: surge 1s 1.9s forwards; padding-left: 10px; }
  #barra { width: min(60vw, 280px); height: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; opacity: 0; animation: surge .6s 2.2s forwards; margin-top: 10px; }
  #barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rosa), var(--ciano)); transition: width .3s; }
  #dica { font: 700 11px 'Share Tech Mono'; color: #7f97b3; max-width: 70vw; opacity: 0; animation: surge .6s 2.4s forwards; min-height: 28px; }
  @keyframes surge { from { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
</style>
</head>
<body>
<canvas id="fundo"></canvas><div id="chuvaCss"></div><div id="scan"></div>
<div id="splash">
  <img id="logoNektra" src="nektra_logo1.png" alt="Nektra" onerror="this.style.display='none'">
  <div id="tit">NEON RAIDERS</div>
  <div id="sub">SURVIVAL PROTOCOL</div>
  <div id="barra"><i id="prog"></i></div>
  <div id="dica"></div>
</div>
<script src="menu-cenario.js"></script>
<script src="paisagem.js"></script>
<script>
  // Abertura: logo da Nektra → título → barra. Depois segue para o menu (o menu manda para o login se não houver conta).
  var DICAS = ['Sobreviva a ondas infinitas de ameaças cyber.', 'Entre ondas, gaste sucata na loja e monte sua build.', 'Chame até 3 amigos para o modo CO-OP ONLINE.', 'O Dash deixa você invulnerável por um instante.'];
  document.getElementById('dica').textContent = DICAS[Math.floor(Math.random() * DICAS.length)];
  var p = 0, barra = document.getElementById('prog');
  var iv = setInterval(function () { p = Math.min(100, p + 4 + Math.random() * 6); barra.style.width = p + '%'; if (p >= 100) { clearInterval(iv); setTimeout(function () { location.replace('menu.html'); }, 350); } }, 140);
</script>
</body>
</html>
