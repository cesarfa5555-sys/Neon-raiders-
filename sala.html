<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>NEON RAIDERS — Co-op Online</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="sala.css">
</head>
<body>
<canvas id="fundo"></canvas><div id="scan"></div>

<div class="pagina">
  <div class="barraTopo">
    <button class="btnIcone" id="btnVoltar" style="margin-right:auto" aria-label="Voltar">◀</button>
    <div class="pilula" id="pilPing"><span id="pingDot">●</span><b id="pingTxt">--</b></div>
  </div>
  <div id="tituloPg">CO-OP ONLINE</div>

  <!-- ANTES DE ENTRAR NUMA SALA -->
  <div id="telaEntrar">
    <div class="painel">
      <div class="titulo">SERVIDOR</div>
      <div id="statusServidor" class="mono">Verificando conexão…</div>
    </div>
    <button class="btn" id="btnRapida">PARTIDA RÁPIDA</button>
    <button class="btn rosa" id="btnCriar">CRIAR SALA PRIVADA</button>
    <div class="painel">
      <div class="titulo">ENTRAR COM CÓDIGO</div>
      <div id="linhaCodigo"><input id="inputCodigo" maxlength="5" placeholder="K7M2P" autocomplete="off" autocapitalize="characters"><button class="btn sec" id="btnEntrar">ENTRAR</button></div>
    </div>
    <p class="nota mono">Até 4 jogadores. Vocês enfrentam a mesma horda, cada um evolui as próprias habilidades e podem se reviver.</p>
  </div>

  <!-- DENTRO DA SALA -->
  <div id="telaSala" class="oculto">
    <div class="painel" style="text-align:center">
      <div class="titulo">CÓDIGO DA SALA</div>
      <div id="codigo">-----</div>
      <button class="btn sec" id="btnCopiar" style="margin-top:8px;padding:9px">COPIAR / COMPARTILHAR</button>
    </div>
    <div id="slots"></div>
    <button class="btn ouro" id="btnPronto">ESTOU PRONTO</button>
    <button class="btn" id="btnIniciar">INICIAR PARTIDA</button>
    <button class="btn sec" id="btnSairSala">SAIR DA SALA</button>
  </div>
</div>

<div id="toast"></div>
<script src="config-servidor.js"></script>
<script src="data.js"></script>
<script src="dados.js"></script>
<script src="guarda.js"></script>
<script src="conta.js"></script>
<script src="audio.js"></script>
<script src="rede.js"></script>
<script src="menu-cenario.js"></script>
<script src="auto-voltar.js"></script>
<script src="sala.js"></script>
<script type="module" src="manutencao.js"></script>
<script type="module" src="atualizacao.js"></script>
<script src="paisagem.js"></script>
</body>
</html>
